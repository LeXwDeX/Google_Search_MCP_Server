name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: Format, lint & test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Lint
              run: cargo clippy --locked --all-targets -- -D warnings

            - name: Run tests
              run: cargo test --locked --all-targets

            - name: Build release binary
              run: cargo build --locked --release

    linux:
        name: Linux x86_64
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Build release binary
              run: cargo build --locked --release

            - name: Package
              run: |
                  set -euo pipefail
                  mkdir -p dist
                  tar -czf dist/google-search-mcp-linux-x86_64.tar.gz \
                    -C target/release google-search-mcp

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: google-search-mcp-linux-x86_64
                  path: dist/google-search-mcp-linux-x86_64.tar.gz
                  if-no-files-found: error

    macos:
        name: macOS universal2
        runs-on: macos-15
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Add macOS targets
              run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

            - name: Build (arm64)
              run: cargo build --locked --release --target aarch64-apple-darwin

            - name: Build (x86_64)
              run: cargo build --locked --release --target x86_64-apple-darwin

            - name: Create and ad-hoc sign universal binary
              run: |
                  set -euo pipefail
                  mkdir -p dist
                  lipo -create \
                    target/aarch64-apple-darwin/release/google-search-mcp \
                    target/x86_64-apple-darwin/release/google-search-mcp \
                    -output dist/google-search-mcp
                  codesign --force --sign - dist/google-search-mcp
                  codesign --verify --strict --verbose=2 dist/google-search-mcp
                  lipo -info dist/google-search-mcp
                  ditto -c -k --norsrc dist/google-search-mcp \
                    dist/google-search-mcp-macos-universal2.zip
                  rm -f dist/google-search-mcp

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: google-search-mcp-macos-universal2
                  path: dist/google-search-mcp-macos-universal2.zip
                  if-no-files-found: error

    windows:
        name: Windows x86_64
        runs-on: windows-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Build release binary
              run: cargo build --locked --release

            - name: Stage artifact
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force dist | Out-Null
                  Copy-Item "target\release\google-search-mcp.exe" `
                    "dist\google-search-mcp-windows-x86_64.exe"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: google-search-mcp-windows-x86_64
                  path: dist/google-search-mcp-windows-x86_64.exe
                  if-no-files-found: error

    release:
        name: Checksums, signature & publish
        needs: [test, linux, macos, windows]
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Verify tag matches Cargo.toml
              shell: bash
              run: |
                  VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
                  if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
                    echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${VERSION}"
                    exit 1
                  fi

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Verify expected artifacts
              shell: bash
              run: |
                  set -euo pipefail
                  for file in \
                    artifacts/google-search-mcp-linux-x86_64.tar.gz \
                    artifacts/google-search-mcp-macos-universal2.zip \
                    artifacts/google-search-mcp-windows-x86_64.exe; do
                    test -f "$file" || { echo "::error::missing $file"; exit 1; }
                  done

            - name: Create checksums
              shell: bash
              run: |
                  set -euo pipefail
                  cd artifacts
                  sha256sum google-search-mcp-* > SHA256SUMS
                  sha256sum -c SHA256SUMS

            - name: Install cosign
              uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07
              with:
                  cosign-release: v3.1.3

            - name: Sign and verify the checksum manifest
              shell: bash
              run: |
                  set -euo pipefail
                  cd artifacts
                  cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
                  cosign verify-blob \
                    --bundle SHA256SUMS.sigstore.json \
                    --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
                    --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                    SHA256SUMS

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: artifacts/*
                  generate_release_notes: true